{% extends 'predictor/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Twitter Sentiment Prediction</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    {{ form.text.label_tag }}
                    {{ form.text}}
                </div>

                <div class="mb-3">
                    {{ form.city.label_tag }}
                    {{ form.city }}
                </div>

                <button type="submit" class="btn btn-success">
                    Predict
                </button>

            </form>

            {% if prediction %}

            <div class="alert alert-success mt-4">
                <h4>Prediction Result</h4>
                <h2>{{ prediction }}</h2>
            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
